<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Learning Timer</title>
    <style>
        /* 全体のリセットと背景・文字色設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            /* 寺田倉庫ICTサイトに合わせたモダンなフォント指定 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* タイマーコンテナ */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 2vh 0; /* 余白を調整 */
        }

        /* タイマー数字：極限まで大きく調整 */
        #timer {
            font-size: 38vw; /* サイズをさらに拡大 */
            font-weight: 700;
            line-height: 0.8; /* 行間をさらに詰める */
            letter-spacing: -0.04em; /* 文字間隔をさらに詰める */
            text-align: center;
            font-variant-numeric: tabular-nums; /* 数字の幅を固定してガタつきを防止 */
        }

        /* 下部のイベント名ロゴ（フォントとトラッキングをサイトに最適化） */
        #logo {
            font-size: 3.2vw;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-top: 3vh; /* 余白を調整 */
            text-transform: uppercase;
        }

        /* コントロールボタン：目立たない超シンプルデザイン */
        .controls {
            position: absolute;
            top: 3vh;
            right: 3vh;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn {
            background: none;
            border: none;
            color: #999999; /* 目立たない薄いグレー */
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .btn:hover {
            color: #000000; /* ホバー時のみ黒くなる */
        }

        /* フルスクリーン案内（薄く表示） */
        #guide {
            position: absolute;
            bottom: 2vh;
            font-size: 11px;
            color: #dddddd;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn" id="start-stop-btn" onclick="toggleTimer()">START</button>
        <button class="btn" onclick="resetTimer()">RESET</button>
        <button class="btn" onclick="toggleFullscreen()">FULLSCREEN</button>
    </div>

    <div class="container">
        <div id="timer">05:00</div>

        <div id="logo">Peer Learning Timer</div>
    </div>

    <div id="guide">SPACE: Start/Stop | R: Reset | F: Fullscreen</div>

    <script>
        const DEFAULT_TIME = 300; // 5分 = 300秒
        let timeLeft = DEFAULT_TIME;
        let timerId = null;

        const timerDisplay = document.getElementById('timer');
        const startStopBtn = document.getElementById('start-stop-btn');

        // 表示更新
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // スタート / ストップ
        function toggleTimer() {
            if (timerId === null) {
                if (timeLeft === 0) return;
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        startStopBtn.textContent = 'START';
                    }
                }, 1000);
                startStopBtn.textContent = 'STOP';
            } else {
                clearInterval(timerId);
                timerId = null;
                startStopBtn.textContent = 'START';
            }
        }

        // リセット
        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = DEFAULT_TIME;
            updateDisplay();
            startStopBtn.textContent = 'START';
        }

        // フルスクリーン切り替え
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // キーボードショートカット
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyR') {
                resetTimer();
            } else if (e.code === 'KeyF') {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
