<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Learning Timer</title>
    <style>
        /* 全体のリセットと背景・文字色設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* タイマーコンテナ */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 2vh 5vw; /* 左右にも余裕を持たせる */
        }

        /* タイマー数字・終了文字：絶対に崩れないよう画面に追従 */
        #timer {
            /* 横幅(vw)と縦幅(vh)を比較し、はみ出さない最大のサイズを自動計算 */
            font-size: min(35vw, 45vh); 
            font-weight: 700;
            line-height: 1; /* 行間を標準に戻し、上下の見切れを防止 */
            letter-spacing: -0.04em;
            text-align: center;
            font-variant-numeric: tabular-nums;
            white-space: nowrap; /* 画面が狭くても絶対に改行させない */
        }

        /* 下部のイベント名ロゴ領域 */
        #logo {
            font-size: min(4vw, 5vh); /* 文字表示時も崩れないように自動計算 */
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-top: 6vh; /* タイマーを邪魔しない適度な余白 */
            text-transform: uppercase;
            /* 画像の高さも、横幅と縦幅のバランスを見てタイマーを圧迫しないよう制限 */
            height: min(15vw, 20vh); 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #logo img {
            height: 100%; 
            max-width: 100%;
            object-fit: contain;
        }

        /* コントロールボタン：左上に配置 */
        .controls {
            position: absolute;
            top: 3vh;
            left: 3vh;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn {
            background: none;
            border: none;
            color: #999999;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .btn:hover {
            color: #000000;
        }
        
        .btn.active-time {
            color: #000000;
            font-weight: 700;
            border-bottom: 2px solid #000000;
        }

        /* フルスクリーン案内（薄く表示） */
        #guide {
            position: absolute;
            bottom: 2vh;
            font-size: 11px;
            color: #dddddd;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn active-time" id="btn-5min" onclick="setTime(300)">5 MIN</button>
        <button class="btn" id="btn-3min" onclick="setTime(180)">3 MIN</button>
        <button class="btn" id="start-stop-btn" onclick="toggleTimer()">START</button>
        <button class="btn" onclick="resetTimer()">RESET</button>
        <button class="btn" onclick="toggleFullscreen()">FULLSCREEN</button>
    </div>

    <div class="container">
        <!-- 初期表示 -->
        <div id="timer">05:00</div>
        <!-- ロゴエリア -->
        <div id="logo">
            <img src="image.jpg" alt="Peer Learning">
        </div>
    </div>

    <div id="guide">SPACE: Start/Stop | R: Reset | F: Fullscreen</div>

    <script>
        let currentDefaultTime = 300; // 初期設定を5分(300秒)にする
        let timeLeft = currentDefaultTime;
        let timerId = null;

        const timerDisplay = document.getElementById('timer');
        const startStopBtn = document.getElementById('start-stop-btn');
        const logoDisplay = document.getElementById('logo'); 
        const btn5min = document.getElementById('btn-5min');
        const btn3min = document.getElementById('btn-3min');

        // 画像のHTMLタグ
        const logoImgHTML = '<img src="image.jpg" alt="Peer Learning">';

        // 時間の切り替え設定
        function setTime(seconds) {
            currentDefaultTime = seconds;
            
            // ボタンの見た目（アクティブ状態）を切り替え
            if (seconds === 300) {
                btn5min.classList.add('active-time');
                btn3min.classList.remove('active-time');
            } else {
                btn3min.classList.add('active-time');
                btn5min.classList.remove('active-time');
            }
            
            resetTimer();
        }

        // 表示更新
        function updateDisplay() {
            if (timeLeft <= 0) {
                // 終了時の表示（数字があった場所にそのまま表示）
                timerDisplay.textContent = '終了';
                logoDisplay.innerHTML = logoImgHTML;
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // 残り時間に応じたテキスト切り替え（それぞれ10秒間のみ表示）
            if (timeLeft <= 60 && timeLeft > 50) {
                logoDisplay.textContent = '残り1分';
            } else if (timeLeft <= 30 && timeLeft > 20) {
                logoDisplay.textContent = '残り30秒';
            } else {
                logoDisplay.innerHTML = logoImgHTML;
            }
        }

        // スタート / ストップ
        function toggleTimer() {
            if (timerId === null) {
                if (timeLeft === 0) return;
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        startStopBtn.textContent = 'START';
                    }
                }, 1000);
                startStopBtn.textContent = 'STOP';
            } else {
                clearInterval(timerId);
                timerId = null;
                startStopBtn.textContent = 'START';
            }
        }

        // リセット
        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = currentDefaultTime; 
            updateDisplay();
            startStopBtn.textContent = 'START';
        }

        // フルスクリーン切り替え
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // キーボードショートカット
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                
                // 終了状態でSpaceを押した場合はリセットする
                if (timeLeft <= 0) {
                    resetTimer();
                } else {
                    toggleTimer();
                }
            } else if (e.code === 'KeyR') {
                resetTimer();
            } else if (e.code === 'KeyF') {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
