<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Learning Timer</title>
    <style>
        /* 全体のリセットと背景・文字色設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            /* 寺田倉庫ICTサイトに合わせたモダンなフォント指定 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* タイマーコンテナ */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 2vh 0; /* 余白を調整 */
        }

        /* タイマー数字：極限まで大きく調整 */
        #timer {
            font-size: 38vw; /* サイズをさらに拡大 */
            font-weight: 700;
            line-height: 0.8; /* 行間をさらに詰める */
            letter-spacing: -0.04em; /* 文字間隔をさらに詰める */
            text-align: center;
            font-variant-numeric: tabular-nums; /* 数字の幅を固定してガタつきを防止 */
        }

        /* 下部のイベント名ロゴ（フォントとトラッキングをサイトに最適化） */
        #logo {
            font-size: 3.2vw;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-top: 10vh; /* 位置を下に下げました */
            text-transform: uppercase;
        }

        /* コントロールボタン：左上に配置 */
        .controls {
            position: absolute;
            top: 3vh;
            left: 3vh; /* 右から左上に変更 */
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn {
            background: none;
            border: none;
            color: #999999; /* 目立たない薄いグレー */
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .btn:hover {
            color: #000000; /* ホバー時のみ黒くなる */
        }
        
        .btn.active-time {
            color: #000000;
            font-weight: 700;
            border-bottom: 2px solid #000000;
        }

        /* フルスクリーン案内（薄く表示） */
        #guide {
            position: absolute;
            bottom: 2vh;
            font-size: 11px;
            color: #dddddd;
            letter-spacing: 0.05em;
        }

        /* 終了時の全画面画面 */
        #end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; /* 全画面を黒にする */
            display: none; /* 初期状態は非表示 */
            justify-content: center;
            align-items: center;
            z-index: 1000; /* 最前面に表示 */
        }

        .end-text {
            font-size: 35vw; /* タイマーと同等の大きさ */
            font-weight: 700;
            letter-spacing: -0.04em;
            color: #ffffff; /* 文字を白にする */
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn active-time" id="btn-5min" onclick="setTime(300)">5 MIN</button>
        <button class="btn" id="btn-3min" onclick="setTime(180)">3 MIN</button>
        <button class="btn" id="start-stop-btn" onclick="toggleTimer()">START</button>
        <button class="btn" onclick="resetTimer()">RESET</button>
        <button class="btn" onclick="toggleFullscreen()">FULLSCREEN</button>
    </div>

    <div class="container">
        <div id="timer">05:00</div>

        <div id="logo">Peer Learning </div>
    </div>

    <div id="guide">SPACE: Start/Stop | R: Reset | F: Fullscreen</div>

    <!-- 終了時の全画面画面 -->
    <div id="end-screen">
        <div class="end-text">終了</div>
    </div>

    <script>
        let currentDefaultTime = 300; // 初期設定を5分(300秒)にする
        let timeLeft = currentDefaultTime;
        let timerId = null;

        const timerDisplay = document.getElementById('timer');
        const startStopBtn = document.getElementById('start-stop-btn');
        const logoDisplay = document.getElementById('logo'); 
        const endScreen = document.getElementById('end-screen');
        const btn5min = document.getElementById('btn-5min');
        const btn3min = document.getElementById('btn-3min');

        // 時間の切り替え設定
        function setTime(seconds) {
            currentDefaultTime = seconds;
            
            // ボタンの見た目（アクティブ状態）を切り替え
            if (seconds === 300) {
                btn5min.classList.add('active-time');
                btn3min.classList.remove('active-time');
            } else {
                btn3min.classList.add('active-time');
                btn5min.classList.remove('active-time');
            }
            
            resetTimer(); // 選択した時間でタイマーをリセット
        }

        // 表示更新
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // 残り時間に応じたテキスト切り替え
            if (timeLeft <= 60 && timeLeft > 30) {
                logoDisplay.textContent = '残り1分';
            } else if (timeLeft <= 30 && timeLeft > 0) {
                logoDisplay.textContent = '残り30秒';
            } else {
                logoDisplay.textContent = 'Peer Learning';
            }
        }

        // スタート / ストップ
        function toggleTimer() {
            if (timerId === null) {
                if (timeLeft === 0) return;
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        startStopBtn.textContent = 'START';
                        // 終了時の全画面画面を表示
                        endScreen.style.display = 'flex';
                    }
                }, 1000);
                startStopBtn.textContent = 'STOP';
            } else {
                clearInterval(timerId);
                timerId = null;
                startStopBtn.textContent = 'START';
            }
        }

        // リセット
        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = currentDefaultTime; // 現在設定されている時間にリセット
            updateDisplay();
            startStopBtn.textContent = 'START';
            // 終了時の全画面画面を非表示にする
            endScreen.style.display = 'none';
        }

        // フルスクリーン切り替え
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // キーボードショートカット
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // スクロール等のデフォルト動作を防止
                
                // 終了画面が出ている状態でSpaceを押した場合は、リセットする
                if (endScreen.style.display === 'flex') {
                    resetTimer();
                } else {
                    toggleTimer();
                }
            } else if (e.code === 'KeyR') {
                resetTimer();
            } else if (e.code === 'KeyF') {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
